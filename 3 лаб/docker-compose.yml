services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: ${PORT:-5000}
      SPOT_COUNT: ${SPOT_COUNT:-2}
      PRICE_PER_HOUR: ${PRICE_PER_HOUR:-100}
      BLOCKED_PLATES: ${BLOCKED_PLATES:-}
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.getenv('PORT','5000')+'/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
