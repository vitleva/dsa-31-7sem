services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flights
    volumes:
      - flightdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flights"]
      interval: 2s
      retries: 30

  seed:
    build: .
    command: ["python", "-m", "common.db"]
    environment:
      DATABASE_URL_SYNC: postgresql+psycopg://postgres:postgres@db:5432/flights
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  provider1:
    build: .
    command: ["uvicorn", "provider.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      PROVIDER_ID: "1"
      MEAN_DELAY_MS: "300"
      ERROR_RATE: "0.05"
      SLOW_RATE: "0"
      FLIGHTS_PER_DAY: "500"
    healthcheck: &provider_health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 2s
      retries: 30

  provider2:
    build: .
    command: ["uvicorn", "provider.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      PROVIDER_ID: "2"
      MEAN_DELAY_MS: "500"
      ERROR_RATE: "0.05"
      SLOW_RATE: "0"
      FLIGHTS_PER_DAY: "500"
    healthcheck: *provider_health

  provider3:
    build: .
    command: ["uvicorn", "provider.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      PROVIDER_ID: "3"
      MEAN_DELAY_MS: "800"
      ERROR_RATE: "0.05"
      SLOW_RATE: "0.10"
      FLIGHTS_PER_DAY: "500"
    healthcheck: *provider_health

  search:
    build: .
    ports:
      - "8000:8000"
    environment:
      SERVICE_VERSION: ${SERVICE_VERSION:-1}
      DATABASE_URL_SYNC: postgresql+psycopg://postgres:postgres@db:5432/flights
      DATABASE_URL_ASYNC: postgresql+asyncpg://postgres:postgres@db:5432/flights
      PROVIDER_1_URL: http://provider1:8000
      PROVIDER_2_URL: http://provider2:8000
      PROVIDER_3_URL: http://provider3:8000
    depends_on:
      seed:
        condition: service_completed_successfully
      provider1:
        condition: service_healthy
      provider2:
        condition: service_healthy
      provider3:
        condition: service_healthy
    cap_add:
      - SYS_PTRACE
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 2s
      retries: 30

volumes:
  flightdata:
